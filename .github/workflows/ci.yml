name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Bun ${{ matrix.bun }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bun: ["1.4.0", latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  runtime:
    name: CLI smoke test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack
        run: |
          bun pm pack --quiet
          echo "TARBALL=$GITHUB_WORKSPACE/$(ls anturno-branch-*.tgz)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Run packed CLI with Node
        run: |
          mkdir -p "$RUNNER_TEMP/sample" && cd "$RUNNER_TEMP/sample"
          git init -q && echo '{"name":"sample"}' > package.json
          node --version
          npm install --global "$TARBALL"
          branch --version
          branch init
          test -f .branch/context.json
